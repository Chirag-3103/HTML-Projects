<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color:rgb(0, 255, 255);" >
    <h2><center>Login First</center></h2>
    <center><form action="afterloginpage.html">
        <label for="name">Name:</label>
            <input type="text" id="name" placeholder="Name" required><br><br>
        <label for="regno">Register Number:</label>
            <input type="number" id="regno" placeholder="Reg. No." required><br><br>
        <label for="phoneno">Phone Number:</label>
            <input type="number" id="phoneno" max(10) placeholder="P. Number" required><br><br>
        <label>Enter your Education Background:</label><br><br>
            <input type="radio" id="science" name="combi" checked>
                <label for="science">SCIENCE</label>
            <input type="radio" id="commerce" name="combi">
                <label for="science">COMMERCE</label>
            <input type="radio" id="arts" name="combi">
                <label for="science">ARTS</label>
        <br><br><label>Select The Degree you want next(Any 2 Only):</label><br><br>
        <input type="checkbox" id="degree1">
            <label for="degree1">Computer</label><br>
        <input type="checkbox" id="degree2">
            <label for="degree2">Physics</label><br>
        <input type="checkbox" id="degree3">
            <label for="degree3">Chemistry</label><br>
        <input type="checkbox" id="degree4">
            <label for="degree4">Food Science</label><br>
        <input type="checkbox" id="degree5">
            <label for="degree5">Math</label><br>
        <input type="checkbox" id="degree6">
            <label for="degree6">Electronics</label><br>
        <br><br>
        <label>Enter something about Yourself:</label><br>
            <textarea name="aboutyou" placeholder="Start from Here" rows="5" required></textarea>
        <br><br><label>Tick one of these only if your place is one of these:</label><br>
            <select name="city" required>
                <option value="manglore">Manglore</option>
                <option value="delhi">Delhi</option>
                <option value="banglore">Banglore</option>
                <option value="pune">Pune</option>
                <option value="haryana">Haryana</option>
                <option value="coorg">Coorg</option>
                <option value="kerala">Kerala</option>
                <option value="tamilnadu">Tamilnadu</option>
            </select>
        <br><br><label>If All the contents are filled then:</label><br>
        <input type="submit" value="Complete">
    </form>
    </center>
</body>
</html>
